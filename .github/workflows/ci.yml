name: CleanX CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-workflows:
    name: Lint YAML strict (anti-duplicats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clés dupliquées (PyYAML strict)
        run: |
          pip install pyyaml
          python scripts/check_yaml.py .github/workflows/ci.yml .github/workflows/release.yml
      - name: Aucun fichier source manquant (garde B13)
        # Échec si du code source n'est pas versionné (ex. règle gitignore
        # trop large ayant masqué app/lib/src/features/quarantine/).
        run: |
          git status --porcelain --untracked-files=all -- app/lib app/test core/src core/tests scripts docs .github | tee /tmp/git-clean.txt
          test ! -s /tmp/git-clean.txt

  rust:
    name: Moteur Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1  # épinglé = version validée locale
          components: clippy, rustfmt
      - name: Tests
        run: cargo test --manifest-path core/Cargo.toml
        env:
          CLEANX_FUZZ_N: '20000'
          CLEANX_EICAR_DISK: ''
          # CI headless : pas de Secret Service → repli fichier EXPLICITE
          # (prod : refus strict, cf. P9/ADR-009).
          CLEANX_KEY_FALLBACK: '1'
      - name: Clippy strict
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml --check
      - name: Audit vulnérabilités
        run: |
          cargo install cargo-audit --locked
          cargo audit --file core/Cargo.lock

  rust-coverage:
    name: Couverture Rust (seuil 70 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1  # épinglé = version validée locale
          components: llvm-tools-preview
      - name: Installer cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Couverture (hors généré, échec sous 70 %)
        run: >
          cargo llvm-cov --manifest-path core/Cargo.toml
          --lcov --output-path lcov.info
          --ignore-filename-regex 'frb_generated\.rs'
          --fail-under-lines 70
        env:
          # CI headless : pas de Secret Service → repli explicite (cf. P9) ;
          # fuzz réduit (debug instrumenté lent), EICAR réservé à son job.
          CLEANX_KEY_FALLBACK: '1'
          CLEANX_FUZZ_N: '20000'
          CLEANX_EICAR_DISK: ''
      - name: Publier rapport
        uses: actions/upload-artifact@v4
        with:
          name: couverture-rust
          path: lcov.info

  eicar-linux:
    name: EICAR disque réel (Linux, sans AV)
    runs-on: ubuntu-latest
    env:
      CLEANX_EICAR_DISK: '1'
      CLEANX_KEY_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1  # épinglé = version validée locale
      - name: Test EICAR bout-en-bout
        run: cargo test --manifest-path core/Cargo.toml --test eicar_disque -- --nocapture

  supply-chain:
    name: Supply chain (deny + geiger + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1  # épinglé = version validée locale
      - name: Installer outillage
        run: |
          cargo install cargo-deny cargo-geiger cargo-cyclonedx --locked
      - name: cargo deny check (licences + bans + advisories)
        run: cargo deny check
        working-directory: core
      # NOTE (B12) : geiger est purement INFORMATIF (exit 0 même si unsafe
      # trouvé — le gate reste deny+audit). L'ancienne option `--output-file`
      # n'existe pas (échec CI 54 s) : redirection stdout exigée.
      - name: cargo geiger (rapport unsafe)
        run: cargo geiger --output-format GitHubMarkdown > geiger.md
        working-directory: core
      - name: SBOM CycloneDX
        run: cargo cyclonedx --format json --override-filename sbom
        working-directory: core
      - name: Publier rapports
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            core/sbom.json
            core/geiger.md

  flutter:
    name: Flutter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'  # épinglé = version validée locale (anti-dérive SDK)
      - name: Dépendances
        run: flutter pub get
        working-directory: app
      - name: Localisations
        run: flutter gen-l10n
        working-directory: app
      - name: Analyse
        run: flutter analyze
        working-directory: app
      - name: Tests (moteur simulé)
        run: flutter test
        working-directory: app

  dart-coverage:
    name: Couverture Dart (seuil 60 %)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'  # épinglé = version validée locale (anti-dérive SDK)
      - name: Tests + lcov
        run: flutter test --coverage
        working-directory: app
      - name: Vérifier seuil manuel (hors généré) ≥ 60 %
        run: python3 scripts/check_coverage.py app/coverage/lcov.info 60
      - name: Publier rapport
        uses: actions/upload-artifact@v4
        with:
          name: couverture-dart
          path: app/coverage/lcov.info

  windows-e2e:
    name: Windows E2E (lib native + FFI)
    runs-on: windows-latest
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1  # épinglé = version validée locale
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'  # épinglé = version validée locale (anti-dérive SDK)
      - name: Lib native release
        run: cargo build --release --manifest-path core/Cargo.toml
      - name: Test E2E FRB (lib réelle)
        run: flutter test test/frb_e2e_test.dart
        working-directory: app
      - name: Build Windows
        run: |
          ../scripts/build_windows.ps1
          flutter build windows --release --dart-define=CLEANX_FRB=true
        working-directory: app

  ios-unsigned:
    name: iOS libs natives (sans liaison .app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1  # épinglé = version validée locale
          targets: aarch64-apple-ios,x86_64-apple-ios
      - name: Libs statiques iOS
        run: ./scripts/build_ios.sh --libs-only
      - name: Artefacts .a
        uses: actions/upload-artifact@v4
        with:
          name: ios-libs
          path: |
            core/target/aarch64-apple-ios/release/libcleanx_core.a
            core/target/x86_64-apple-ios/release/libcleanx_core.a
